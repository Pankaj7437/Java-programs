name: QuickKart CI/CD - Build & Deploy to Azure VM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Image name must be strictly lowercase for GHCR
  IMAGE_NAME_WEB: pankaj7437/java-programs/quickkart-web

jobs:
  # ============================================================================
  # STAGE 1: BUILD & PUSH DOCKER IMAGE IN GITHUB CLOUD
  # ============================================================================
  build-and-push:
    name: Build & Push QuickKart Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push QuickKart Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./quickkart
          file: ./quickkart/docker/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT TO AZURE VM
  # ============================================================================
  deploy:
    name: Deploy QuickKart Stack to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Copy docker compose and database files to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "quickkart/docker-compose.yml,quickkart/database"
          target: "~/quickkart"
          strip_components: 1

      - name: Deploy QuickKart Stack on Azure VM via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            cd ~/quickkart
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "=== Checking running containers ==="
            docker compose ps
            echo "=== QuickKart Deployment Completed! ==="

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PERSISTENT RELATIONAL DATABASE: MySQL 8.0 (Low-Memory Tuned)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: quickkart-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-quickkart}
      MYSQL_USER: ${DB_USER:-quickkart_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quickkart_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-quickkart_root_pass}
    command: >
      --innodb-buffer-pool-size=32M
      --performance-schema=OFF
      --key-buffer-size=16M
      --max-connections=25
      --innodb-log-buffer-size=1M
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - quickkart_mysql_data:/var/lib/mysql
      - ./database/quickkart.sql:/docker-entrypoint-initdb.d/01-quickkart.sql:ro
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 160M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - quickkart-network

  # ----------------------------------------------------------------------------
  # 2. WEB APPLICATION CONTAINER: Apache Tomcat 10.1 / Jakarta EE (Low-Memory Tuned)
  # ----------------------------------------------------------------------------
  quickkart-web:
    image: ghcr.io/pankaj7437/java-programs/quickkart-web:latest
    container_name: quickkart-web-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-quickkart}
      DB_USER: ${DB_USER:-quickkart_user}
      DB_PASSWORD: ${DB_PASSWORD:-quickkart_pass}
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:+UseSerialGC -Djava.awt.headless=true -Dfile.encoding=UTF-8"
    ports:
      # Exposes directly on host port 8080 (Accessed via http://<AZURE_VM_IP>:8080)
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 280M
        reservations:
          cpus: '0.10'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - quickkart-network

volumes:
  quickkart_mysql_data:
    name: quickkart_mysql_data

networks:
  quickkart-network:
    name: quickkart-network
    driver: bridge

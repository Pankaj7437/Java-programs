version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PERSISTENT RELATIONAL DATABASE: MySQL 8.0
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: quickkart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-quickkart}
      MYSQL_USER: ${DB_USER:-quickkart_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quickkart_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/quickkart.sql:/docker-entrypoint-initdb.d/01-quickkart.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - quickkart-network

  # ----------------------------------------------------------------------------
  # 2. WEB APPLICATION CONTAINER: Apache Tomcat 10.1 / Jakarta EE
  # ----------------------------------------------------------------------------
  quickkart-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: quickkart-web:latest
    container_name: quickkart-web-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-quickkart}
      DB_USER: ${DB_USER:-quickkart_user}
      DB_PASSWORD: ${DB_PASSWORD:-quickkart_pass}
      JAVA_OPTS: "-Xms256m -Xmx1024m -XX:+UseG1GC"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - quickkart-network

  # ----------------------------------------------------------------------------
  # 3. REVERSE PROXY & INGRESS: Nginx Alpine
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: quickkart-nginx
    restart: unless-stopped
    depends_on:
      - quickkart-web
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - quickkart-network

volumes:
  mysql_data:
    driver: local

networks:
  quickkart-network:
    driver: bridge
